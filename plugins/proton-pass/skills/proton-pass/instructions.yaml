instructions:
  prerequisites:
    - "Python 3.9 or newer."
    - "Proton Pass CLI installed and available as pass-cli or through PROTON_PASS_CLI_PATH."
    - "Supported by Proton Pass CLI: macOS, Linux, and Windows."

  cli:
    unix_entrypoint: "python3 scripts/pass_cli_agent.py <pass-cli arguments>"
    windows_entrypoint: "py -3 scripts/pass_cli_agent.py <pass-cli arguments>"
    installation_check: "Use the managed entrypoint for the requested command; it resolves PROTON_PASS_CLI_PATH before PATH."
    documentation: "https://protonpass.github.io/pass-cli/"
    rules:
      - "Use the managed entrypoint for every pass-cli command."
      - "Treat the managed entrypoint as the authoritative availability check; do not conclude that the CLI is missing merely because pass-cli is absent from PATH."
      - "Before installing or reinstalling the CLI, run the managed entrypoint and read its complete non-secret error."
      - "Read the complete command output and exit code before retrying a failure."

  session:
    health_check: "pass-cli info"
    session_directory:
      - "Honor PROTON_PASS_SESSION_DIR when the host provides it."
      - "Otherwise use a dedicated per-user agent session directory appropriate for macOS, Linux, or Windows."
      - "On macOS, reuse the former Codex agent session directory when it already exists so existing installations migrate without interruption."
    concurrency:
      - "Use the wrapper's cross-platform authentication lock so concurrent agents do not race during login."
    before_every_command:
      - "The managed wrapper runs the health check automatically before the requested command."
      - "Do not invoke a separate health check unless diagnosing a wrapper failure."
      - "Continue when it succeeds with exit code 0."
      - "Re-authenticate only for an authentication error or missing session."
    reauthentication:
      - "Run pass-cli logout --force to clear a stale session."
      - "Prefer PROTON_PASS_PERSONAL_ACCESS_TOKEN when the host injects it."
      - "On macOS, otherwise check Keychain service proton-pass-agent-bootstrap and account default; existing installations may fall back to the former Codex bootstrap entry."
      - "Provide the token only to pass-cli login and remove it before the requested command runs."
      - "When no token is available, ask the user to complete pass-cli login using Proton's normal web flow."
      - "Run pass-cli info and require exit code 0 before continuing."
      - "Retry the original command once."
    token_safety:
      - "Use a minimally scoped, expiring Personal Access Token for automation."
      - "Never place a token in this repository, a command argument, logs, chat output, or a plaintext file."
      - "Use the agent host's secret injection on any platform, or macOS Keychain where available, for unattended recovery."

  discovery:
    commands:
      - "pass-cli vault list --output json"
      - "pass-cli share list --output json"
      - "pass-cli item list --vault-name <VAULT_NAME> --output json"
    rules:
      - "Use --output json for programmatic parsing."
      - "Skip discovery when the required pass:// item or field reference is already known."
      - "When discovery is required, list vaults once, then list only the likely vault; do not call item list without a vault unless a default vault is configured."
      - "Ignore trashed items. When names collide, select the active item by Share ID and Item ID, then reuse that non-secret reference for the rest of the task."
      - "Confirm that the required vault or item is visible; otherwise report the complete non-secret error."

  item_access:
    required_environment:
      name: "PROTON_PASS_AGENT_REASON"
      value: "A brief, specific description of why the item or field is needed."
    commands:
      - "pass-cli item view --vault-name <VAULT_NAME> --item-title <ITEM_TITLE>"
      - "pass-cli item view --vault-name <VAULT_NAME> --item-title <ITEM_TITLE> --field <FIELD_NAME>"
      - "pass-cli item view pass://<SHARE_ID>/<ITEM_ID>"
      - "pass-cli run -- <COMMAND>"
    reason_required_for:
      - "item view"
      - "item create"
      - "item update"
      - "item trash"
      - "item untrash"
      - "vault update"
    rules:
      - "Retrieve only the item or field required for the task."
      - "Prefer direct pass:// references using Share ID and Item ID when names are ambiguous."
      - "When one command needs multiple fields, assign each environment variable its pass:// field reference and execute the consumer once with pass-cli run; keep output masking enabled."
      - "Do not inspect the complete item merely to rediscover field names already known for the operation."
      - "Never print, paste, return, or persist secret field values."

  recovery:
    authentication_failure:
      - "Let the managed wrapper perform one logout, login, verification, and retry cycle."
      - "If recovery still fails, report the complete non-secret error and stop."
    other_failure:
      - "Do not re-authenticate for permission, network, or invalid-command errors."
      - "Report the complete non-secret error and stop when a safe correction is not available."
