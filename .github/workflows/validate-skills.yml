name: Validate Agent Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the Agent Skills reference validator
        run: python -m pip install skills-ref==0.1.1
      - name: Validate all shared skills
        run: |
          for skill in skills/*; do
            agentskills validate "$skill"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify discovery through the general skills installer
        env:
          DISABLE_TELEMETRY: '1'
        run: npx --yes skills@1.5.25 add . --list
