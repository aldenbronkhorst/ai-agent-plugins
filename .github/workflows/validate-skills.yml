name: Validate Plugins

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  graph-auth:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Graph authentication and credential-store boundaries offline
        shell: pwsh
        run: |
          $tests = 'plugins/microsoft-graph/skills/microsoft-graph/tests'
          foreach ($test in @('test_connect_graph.ps1', 'test_graph_transport.ps1', 'test_graph_token_cache.ps1')) {
            & pwsh -NoLogo -NoProfile -File "$tests/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & pwsh -NoLogo -NoProfile -File "$tests/test_graph_token_cache.ps1" -LegacyAdapter
          exit $LASTEXITCODE
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the portable package validators
        run: python -m pip install skills-ref==0.1.1 jsonschema==4.23.0 PyYAML==6.0.3
      - name: Validate manifests, generated packages, helpers, and icons
        run: python scripts/validate_packages.py
      - name: Test plugin registration and package boundaries
        run: python -m unittest discover -s tests -v
      - name: Test Odoo JSON-2 transport
        run: python -m unittest discover -s plugins/odoo-19/skills/odoo-19/tests -v
      - name: Validate all shared skills
        run: |
          for skill in plugins/*/skills/* skills/*; do
            agentskills validate "$skill"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the Claude marketplace and all individual plugins
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.269 plugin validate .
          for plugin in plugins/*; do
            npx --yes @anthropic-ai/claude-code@2.1.269 plugin validate "$plugin"
          done
